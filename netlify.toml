[build]
  command = "npm run build"
  publish = "dist"

# Proxies API calls through Netlify to the Render backend so the browser
# sees everything as same-origin — no CORS setup needed.
[[redirects]]
  from = "/api/*"
  to = "https://chaapdihaati.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback so client-side routes (e.g. /menu, /verify) don't 404 on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
